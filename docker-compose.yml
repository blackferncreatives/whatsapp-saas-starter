version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp_saas
      POSTGRES_PASSWORD: whatsapp_saas
      POSTGRES_DB: whatsapp_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # remove in production if Postgres shouldn't be public
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whatsapp_saas']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # One-shot: applies any new migrations, then exits. Runs before the
  # api/worker start via `depends_on: condition: service_completed_successfully`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'scripts/migrate.js']

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ['node', 'src/queue/campaignWorker.js']
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        VITE_META_APP_ID: ${META_APP_ID}
        VITE_META_CONFIG_ID: ${META_CONFIG_ID}
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
