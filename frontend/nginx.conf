server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router uses client-side routing, so any path that isn't a real
  # file (e.g. /campaigns) should still serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reasonable caching for hashed build assets; index.html itself is
  # excluded above so new deploys are picked up immediately.
  location ~* \.(js|css|svg|png|jpg|jpeg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
